<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
</head>
<body>
    <div class="body1">

    
  <div class="container">
    <h1 class="title">Login</h1>
    <p class="subtitle">To get started, you need to sign in here.</p>
    <div class="card">
      <form>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="i.e. john@mail.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="********" required />

        

        <button type="submit">Sign In</button>
      </form>
    </div>
    <p class="footer-text">Don't have an account? <a href="#">Create an account</a></p>
  </div>

</div>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Roboto, sans-serif; ;
  
}

body {
  background-color: #f8f9fb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
}

.container {
  text-align: center;
}

.title {
  font-size: 48px;
  font-weight: 700;
  color: #111827;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 16px;
  color: #6b7280;
  margin-bottom: 32px;
}

.card {
  background-color: white;
  border-radius: 12px;
  box-shadow: 0px 4px 12px rgba(0,0,0,0.05);
  padding: 32px;
  width: 320px;
  text-align: left;
  margin: 0 auto;
}

form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

label {
  font-size: 14px;
  font-weight: 600;
  color: #111827;
}

input {
  padding: 12px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}

input:focus {
  border-color: #6366f1;
  box-shadow: 0 0 0 1px #6366f1;
}

button {
  margin-top: 8px;
  padding: 12px;
  background-color: #4f46e5;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s ease-in-out;
}

button:hover {
  background-color: #4338ca;
}

.footer-text {
  margin-top: 24px;
  font-size: 14px;
  color: #6b7280;
}

.footer-text a {
  color: #6366f1;
  text-decoration: none;
}

.footer-text a:hover {
  text-decoration: underline;
}

</style>
</body>
</html>
